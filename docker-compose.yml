services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releasemesh
      POSTGRES_PASSWORD: releasemesh
      POSTGRES_USER: releasemesh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  local_artifacts:
  api_node_modules:
  worker_node_modules:
  pricing_node_modules:
  checkout_node_modules:
  shell_node_modules:
  catalog_mfe_node_modules:
  release_mfe_node_modules:
