# M0-M1 application entries are dependency-install scaffolds only. Each service
# replaces its placeholder command with its own dev command in its delivery milestone.
services:
  api:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      - postgres
      - redis

  worker:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - worker_node_modules:/workspace/node_modules
      - local_artifacts:/workspace/artifacts
    depends_on:
      - postgres
      - redis

  pricing:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - pricing_node_modules:/workspace/node_modules

  checkout:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - checkout_node_modules:/workspace/node_modules

  shell:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - shell_node_modules:/workspace/node_modules

  catalog-mfe:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - catalog_mfe_node_modules:/workspace/node_modules

  release-mfe:
    image: node:22-alpine
    profiles: ["application"]
    working_dir: /workspace
    command: sh -c "corepack pnpm install --frozen-lockfile && exec tail -f /dev/null"
    volumes:
      - .:/workspace
      - release_mfe_node_modules:/workspace/node_modules
